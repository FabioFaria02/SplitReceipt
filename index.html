<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c0f1d">
<meta name="description" content="Divide recibos entre amigos: a IA lê o recibo, traduz para português, converte para euros e calcula quem deve quanto.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SplitReceipt">
<title>SplitReceipt</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="css/styles.css">
<script>
  // Tema antes do primeiro paint para evitar "flash".
  try {
    const s = JSON.parse(localStorage.getItem("sr.settings.v1") || "{}");
    const t = s.theme && s.theme !== "auto" ? s.theme : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.dataset.theme = t;
  } catch { document.documentElement.dataset.theme = "dark"; }
</script>
</head>
<body>
<div class="backdrop" aria-hidden="true">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="grain"></div>
</div>

<div class="app">
  <header class="topbar glass">
    <div class="brand">
      <div class="logo"><i class="fa-solid fa-receipt"></i></div>
      <div class="brand-text">
        <h1>SplitReceipt</h1>
        <button class="split-name" id="splitNameBtn" title="Mudar o nome desta divisão"><span id="splitName">—</span><i class="fa-solid fa-pen"></i></button>
      </div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="historyBtn" title="Histórico de divisões" aria-label="Histórico"><i class="fa-solid fa-clock-rotate-left"></i></button>
      <button class="icon-btn" id="themeBtn" title="Tema" aria-label="Tema"><i class="fa-solid fa-moon"></i></button>
      <button class="icon-btn" id="settingsBtn" title="Definições" aria-label="Definições"><i class="fa-solid fa-sliders"></i></button>
      <button class="btn primary hide-sm" id="addBtn"><i class="fa-solid fa-plus"></i><span>Adicionar recibo</span></button>
    </div>
  </header>

  <div id="sharedBanner" class="shared-banner glass hidden">
    <i class="fa-solid fa-eye"></i>
    <div><strong>Vista partilhada</strong><span>Estás a ver uma divisão que alguém te enviou. Só de leitura.</span></div>
    <button class="btn" id="importSharedBtn"><i class="fa-solid fa-download"></i> Guardar cópia</button>
    <button class="btn ghost" id="closeSharedBtn">Fechar</button>
  </div>

  <div class="layout">
    <main class="main" id="main">
      <section class="hero glass" id="hero"></section>

      <section id="dropzone" class="dropzone glass">
        <div class="dz-icon"><i class="fa-solid fa-camera-retro"></i></div>
        <div class="dz-text">
          <strong>Arrasta recibos para aqui</strong>
          <span>Fotos ou PDF · vários de uma vez · qualquer moeda</span>
        </div>
        <div class="dz-actions">
          <label class="btn primary" for="cameraInput"><i class="fa-solid fa-camera"></i><span>Fotografar</span></label>
          <label class="btn" for="fileInput"><i class="fa-solid fa-file-arrow-up"></i><span>Carregar</span></label>
          <button class="btn ghost" id="moreImportBtn" title="Mais opções"><i class="fa-solid fa-ellipsis"></i></button>
        </div>
      </section>

      <div id="brushBar" class="brush-bar glass hidden"></div>

      <section id="receipts" class="receipts"></section>
    </main>

    <aside class="sidebar" id="sidebar">
      <section class="panel glass" id="peoplePanel"></section>
      <section class="panel glass" id="summaryPanel"></section>
      <section class="panel glass" id="transfersPanel"></section>
      <section class="panel glass" id="sharePanel"></section>
    </aside>
  </div>

  <footer class="foot">Os dados ficam guardados apenas neste dispositivo · <button class="link" id="aboutBtn">Como funciona</button></footer>
</div>

<nav class="bottom-bar glass">
  <button id="bbBrush"><i class="fa-solid fa-paintbrush"></i><span>Pincel</span></button>
  <button id="bbAdd" class="bb-main"><i class="fa-solid fa-plus"></i></button>
  <button id="bbSummary"><i class="fa-solid fa-scale-balanced"></i><span>Contas</span></button>
</nav>

<input id="cameraInput" type="file" accept="image/*" capture="environment" class="hidden">
<input id="fileInput" type="file" accept="image/*,application/pdf" multiple class="hidden">

<div id="modalRoot"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="dragOverlay" class="drag-overlay hidden"><div><i class="fa-solid fa-cloud-arrow-up"></i><strong>Larga para ler os recibos</strong></div></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
